[project]
name = "escale"
version = "0.1.0"
description = "Assistant de déplacement professionnel, construit avec Claude Code"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anthropic>=2.3,<3",
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "numpy>=2",
    "python-dotenv>=1",
    "voyageai>=0.5,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["escale"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
